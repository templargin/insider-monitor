name: Daily insider monitor

on:
  schedule:
    # 10:30 UTC Mon-Fri = 6:30am EDT (summer) / 5:30am EST (winter)
    # Picked to give the run + GH Actions queueing slack to finish before 7am ET.
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # Guards the screener's validation boundary. If these fail the daily run does
      # not happen — a stale page beats a confidently wrong one.
      - name: Tests
        run: pytest -q

      # continue-on-error so a run that produced no page for TODAY still commits
      # whatever it did produce (catch-up backfills, refreshed company data).
      # The job is failed afterwards by the Verify step below, which is what
      # turns the miss into a Healthchecks /fail ping and a Telegram alert.
      - name: Daily run
        id: daily
        continue-on-error: true
        run: python -m scripts.daily_run

      - name: Commit + push
        run: |
          git config user.name "insider-monitor[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi

      # A green run that silently wrote no page is the failure mode that let
      # 2026-07-29 and 07-30 go dark unnoticed: the runner pings Healthchecks off
      # this workflow's conclusion, so "finished fine, published nothing" read as
      # healthy. daily_run exits non-zero when today's page is missing.
      - name: Verify today's page was written
        if: steps.daily.outcome == 'failure'
        run: |
          echo "::error::Daily run did not produce today's page — see the Daily run step."
          exit 1
